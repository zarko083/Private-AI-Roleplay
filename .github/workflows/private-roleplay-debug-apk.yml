name: Private Roleplay - Validate & APK

# Every push checks the TypeScript frontend.
# A full Android build runs ONLY if the final commit message contains [build-apk].
# This avoids a 40+ minute build for every small UI edit.
on:
  push:
    branches:
      - feature/roleplay-ui-v01
    paths:
      - .github/workflows/private-roleplay-debug-apk.yml
      - app/**
      - lib/**
      - db/**
      - app.config.js
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-roleplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Run pinned memory regression tests
        run: npx jest lib/engine/API/PinnedMemory.test.ts lib/engine/API/NameContext.test.ts lib/constants/ParcTags.test.ts lib/theme/ParcTheme.test.ts lib/utils/AvatarPlacement.test.ts --runInBand --watch=false --ci

  build-release-apk:
    needs: check-frontend
    if: >-
      github.ref == 'refs/heads/feature/roleplay-ui-v01' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Generate Android native project
        env:
          APP_VARIANT: development
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone ARM64 APK
        env:
          APP_VARIANT: development
          CI: '1'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: private-roleplay-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
